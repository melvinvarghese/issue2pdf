name: Build issue2pdf

on:
  workflow_dispatch:
    inputs:
      page_1_url:
        description: "Page 1 SVG URL (https://svg.issuu.com/.../page_1.svg)"
        required: true
        type: string
      output_name:
        description: "Optional custom PDF name (leave blank for issue2pdf_github_DDMMYYYY.pdf)"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pillow requests

      - name: Generate PDF
        env:
          PAGE_1_URL: ${{ inputs.page_1_url }}
          OUTPUT_PDF: ${{ inputs.output_name }}
          TZ: Asia/Kolkata
        run: python make_pdf.py

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: issue2pdf-artifact
          path: "issue2pdf_github_*.pdf"
          
